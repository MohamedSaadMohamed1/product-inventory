openapi: 3.0.3
info:
  title: Product Inventory & Stock Reservation API
  description: |
    Welcome to the Product Inventory & Stock Reservation API.
    
    This production-grade API provides atomic stock reservation, concurrency control, and order lifecycle management protected by JWT authentication.
    
    ### Access Control Rules:
    * **Authentication (Public)**: Register and Login to obtain a JWT Bearer token.
    * **Products Catalog (Public)**: Anyone can read products and view stock levels.
    * **Products Management (Admin Only)**: Admin users can create, update, and delete products/stock levels.
    * **Orders (Authenticated Users)**: Authenticated customers can place orders and view/cancel their own orders.
  version: 1.0.0
  contact:
    name: API Engineering Team
    email: api-support@example.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: http://localhost:8080/api/v1
    description: Local development server
tags:
  - name: Authentication
    description: User account registration and authentication.
  - name: Products
    description: Product catalog viewing and inventory CRUD management.
  - name: Orders
    description: Stock reservation ordering, cancellations, and history lookup.
paths:
  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new user account
      description: Creates a new user account (defaults to 'customer' role).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation error (e.g. password too short)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Username already taken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      tags:
        - Authentication
      summary: Authenticate user credentials
      description: Validates username and password, returning a JWT token valid for 24 hours.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid username or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /products:
    get:
      tags:
        - Products
      summary: List all products
      description: Returns a paginated list of available products in the catalog. (Public access)
      parameters:
        - name: page
          in: query
          description: Page number (1-based)
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          description: Maximum number of products to return
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - Products
      summary: Create a new product (Admin Only)
      description: Adds a new product to the catalog.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '201':
          description: Product created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          description: Validation error or invalid body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Admin role required)

  /products/{id}:
    get:
      tags:
        - Products
      summary: Get a product by ID
      description: Retrieves details of a specific product.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
        - Products
      summary: Update a product (Admin Only)
      description: Modifies price, description, name, or stock quantity of a product.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'
      responses:
        '200':
          description: Product updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          description: Validation error
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Product not found
    delete:
      tags:
        - Products
      summary: Delete a product (Admin Only)
      description: Deletes a product from the catalog.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Product deleted successfully (No Content)
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Product not found

  /orders:
    get:
      tags:
        - Orders
      summary: List user orders
      description: Returns a paginated list of orders placed by the authenticated user.
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          description: Page number (1-based)
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          description: Maximum number of orders to return
          required: false
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - Orders
      summary: Place a new order (Atomic Stock Reservation)
      description: Validates stock, locks product rows, reserves inventory, and creates a PENDING order inside a transaction.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order placed and stock reserved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: Invalid request parameter or missing product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '409':
          description: Insufficient stock (rollback triggered)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /orders/{id}:
    get:
      tags:
        - Orders
      summary: Get order details
      description: Retrieves metadata and items of a specific order. (Restricted to order owner or admin)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Not the owner of the order and not an admin)
        '404':
          description: Order not found

  /orders/{id}/cancel:
    post:
      tags:
        - Orders
      summary: Cancel a pending order
      description: Cancels a PENDING order, releasing the reserved stock back to the inventory catalog.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Order cancelled and stock restored successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Order cancelled successfully"
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Order not found
        '409':
          description: Order is already cancelled or not in PENDING state

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RegisterRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: "newuser"
        password:
          type: string
          format: password
          example: "mypassword"
        role:
          type: string
          enum: [customer, admin, system]
          default: customer
          example: "customer"

    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: "customer"
        password:
          type: string
          format: password
          example: "customerpassword"

    AuthResponse:
      type: object
      properties:
        token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VyX2lkIjoxLCJ1c2VybmFtZSI6ImFkbWluIiwicm9sZSI6ImFkbWluIiwiZXhwIjoxNzkyOTc1NjAwfQ..."
        username:
          type: string
          example: "customer"
        role:
          type: string
          example: "customer"

    CreateProductRequest:
      type: object
      required:
        - name
        - price
        - stock_quantity
      properties:
        name:
          type: string
          example: "PlayStation 5"
        description:
          type: string
          example: "825GB SSD Console"
        price:
          type: integer
          format: int64
          description: Price in cents
          example: 49999
        stock_quantity:
          type: integer
          format: int32
          minimum: 0
          example: 25

    UpdateProductRequest:
      type: object
      required:
        - name
        - price
        - stock_quantity
      properties:
        name:
          type: string
          example: "Sony PlayStation 5"
        description:
          type: string
          example: "825GB SSD Console with updated firmware"
        price:
          type: integer
          format: int64
          example: 44999
        stock_quantity:
          type: integer
          format: int32
          example: 15

    ProductResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: "PlayStation 5"
        description:
          type: string
          example: "825GB SSD Console"
        price:
          type: integer
          format: int64
          example: 49999
        stock_quantity:
          type: integer
          format: int32
          example: 25
        created_at:
          type: string
          format: date-time
          example: "2026-08-25T12:00:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2026-08-25T12:00:00Z"

    CreateOrderRequest:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CreateOrderItemRequest'

    CreateOrderItemRequest:
      type: object
      required:
        - product_id
        - quantity
      properties:
        product_id:
          type: integer
          format: int64
          example: 1
        quantity:
          type: integer
          format: int32
          example: 2

    OrderItemResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 12
        order_id:
          type: integer
          format: int64
          example: 5
        product_id:
          type: integer
          format: int64
          example: 1
        quantity:
          type: integer
          format: int32
          example: 2
        unit_price:
          type: integer
          format: int64
          example: 49999
        created_at:
          type: string
          format: date-time
          example: "2026-08-25T12:05:00Z"

    OrderResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 5
        status:
          type: string
          enum: [PENDING, CANCELLED]
          example: PENDING
        total_amount:
          type: integer
          format: int64
          example: 99998
        created_at:
          type: string
          format: date-time
          example: "2026-08-25T12:05:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2026-08-25T12:05:00Z"
        cancelled_at:
          type: string
          format: date-time
          nullable: true
          example: null
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemResponse'

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: "INSUFFICIENT_STOCK"
            message:
              type: string
              example: "Insufficient stock for product 1"
